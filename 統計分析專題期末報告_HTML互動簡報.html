<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>統計分析專題期末報告 HTML 互動簡報</title>
  <style>
    :root {
      --bg:#101522; --ink:#f5f8ff; --muted:#b9c4d6; --panel:#182236; --panel-2:#202d45;
      --line:rgba(255,255,255,.15); --cyan:#22d3ee; --amber:#f4b84a; --rose:#e75f7c;
      --green:#34d399; --purple:#a78bfa; --shadow:0 24px 72px rgba(0,0,0,.36);
    }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:linear-gradient(120deg, rgba(34,211,238,.12), transparent 36%), radial-gradient(circle at 82% 18%, rgba(231,95,124,.18), transparent 34%), linear-gradient(180deg,#0f1422,#151d2f); }
    #progress { position:fixed; z-index:20; top:0; left:0; height:6px; width:0; background:linear-gradient(90deg,var(--cyan),var(--amber),var(--rose)); transition:width .35s ease; }
    #pageInfo { position:fixed; z-index:20; top:42px; right:40px; color:var(--muted); font:15px Consolas,monospace; }
    #deckFooter { position:fixed; z-index:20; left:50%; bottom:18px; transform:translateX(-50%); color:rgba(185,196,214,.78); font-size:14px; white-space:nowrap; pointer-events:none; }
    #overviewToggle { position:fixed; right:22px; bottom:22px; z-index:40; width:48px; height:48px; border-radius:10px; border:1px solid rgba(255,255,255,.22); background:rgba(15,23,42,.58); backdrop-filter:blur(8px); color:var(--ink); cursor:pointer; font-size:22px; box-shadow:0 12px 30px rgba(0,0,0,.28); }
    #overview { position:fixed; z-index:35; inset:0; display:none; padding:74px 52px; overflow:auto; background:rgba(8,12,20,.86); backdrop-filter:blur(12px); }
    #overview.open { display:block; }
    .overview-head { max-width:1320px; margin:0 auto 24px; display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .overview-head h2 { margin:0; font-size:34px; }
    .close-btn { border:1px solid var(--line); color:var(--ink); background:var(--panel); border-radius:8px; padding:10px 14px; cursor:pointer; }
    .overview-grid { max-width:1320px; margin:0 auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .overview-card { min-height:104px; border:1px solid var(--line); background:#182236; color:var(--ink); border-radius:8px; padding:14px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:8px; }
    .overview-card b { color:var(--cyan); font-family:Consolas,monospace; }
    .overview-card span { line-height:1.35; }
    .slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:60px 58px 42px; opacity:0; pointer-events:none; transform:translate3d(0,18px,0) scale(.986); filter:blur(10px); transition:opacity .68s cubic-bezier(.22,.72,.19,1), transform .68s cubic-bezier(.22,.72,.19,1), filter .68s ease; overflow:hidden; background-image:var(--slide-bg); background-size:cover; background-position:center; }
    .slide::before { content:""; position:absolute; inset:0; z-index:0; background:linear-gradient(90deg, rgba(16,21,34,.96) 0%, rgba(16,21,34,.88) 45%, rgba(16,21,34,.58) 100%); pointer-events:none; }
    .slide::after { content:""; position:absolute; inset:0; z-index:0; background:radial-gradient(circle at 16% 18%, rgba(34,211,238,.16), transparent 28%), radial-gradient(circle at 84% 78%, rgba(244,184,74,.12), transparent 28%); pointer-events:none; }
    .slide.active { opacity:1; pointer-events:auto; transform:translate3d(0,0,0) scale(1); filter:blur(0); }
    .slide-inner { position:relative; z-index:1; width:100%; height:100%; max-width:1780px; display:grid; grid-template-columns:minmax(660px, 1.28fr) minmax(430px, .72fr); gap:34px; align-items:center; }
    .slide.active .slide-inner { animation:softReveal .72s cubic-bezier(.22,.72,.19,1) both; }
    .slide.active::after { animation:lightSweep .82s ease-out both; }
    .slide.airy .slide-inner { grid-template-columns:minmax(570px, 1.05fr) minmax(500px, .95fr); }
    .slide.dense .slide-inner { grid-template-columns:minmax(720px, 1.42fr) minmax(380px, .58fr); }
    .slide.ending-slide .slide-inner { display:flex; align-items:center; justify-content:center; text-align:center; }
    .content-side { min-width:0; }
    .content-side h1 { margin:0 0 28px; font-size:clamp(34px, 3.1vw, 62px); line-height:1.08; letter-spacing:0; white-space:nowrap; overflow:visible; }
    .point-list { display:grid; gap:14px; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:stretch; }
    .slide.dense .point-list { gap:12px; }
    .point-card { min-height:126px; display:grid; grid-template-columns:48px 1fr; gap:14px; padding:18px; border:1px solid var(--line); background:rgba(24,34,54,.88); border-radius:8px; box-shadow:0 12px 34px rgba(0,0,0,.18); cursor:pointer; }
    .slide.dense .point-card { min-height:116px; padding:15px; }
    .point-card:nth-child(5) { grid-column:1 / -1; }
    .point-card:hover, .point-card:focus, .point-card.active { outline:none; border-color:rgba(34,211,238,.68); background:rgba(32,45,69,.96); }
    .point-index { color:var(--amber); font:700 20px Consolas,monospace; padding-top:3px; }
    .point-text h2 { margin:0 0 8px; font-size:clamp(20px, 1.45vw, 28px); line-height:1.25; letter-spacing:0; }
    .point-text p { margin:0; color:var(--muted); font-size:clamp(16px, 1vw, 20px); line-height:1.55; }
    .image-side { margin:0; min-height:0; display:flex; align-items:center; justify-content:center; padding:0; align-self:center; }
    .image-side img { display:block; width:100%; height:auto; max-height:calc(100vh - 150px); object-fit:contain; border-radius:10px; border:1px solid var(--line); box-shadow:var(--shadow); background:rgba(17,24,39,.76); }
    .ending-panel { position:relative; width:min(1080px, 86vw); min-height:430px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; border:1px solid rgba(255,255,255,.16); border-radius:18px; background:linear-gradient(135deg, rgba(24,34,54,.68), rgba(24,34,54,.26)); box-shadow:var(--shadow); overflow:hidden; }
    .ending-panel::before { content:""; position:absolute; width:720px; height:720px; border-radius:50%; border:1px solid rgba(34,211,238,.18); transform:translate(-34%, -22%); }
    .ending-panel::after { content:""; position:absolute; inset:auto 8% 18% 8%; height:2px; background:linear-gradient(90deg, transparent, rgba(34,211,238,.64), rgba(244,184,74,.58), transparent); }
    .ending-title { position:relative; z-index:1; margin:0; font-size:clamp(64px, 7vw, 128px); line-height:1; letter-spacing:0; font-weight:900; text-shadow:0 18px 42px rgba(0,0,0,.34); }
    .ending-subtitle { position:relative; z-index:1; margin:0; font-size:clamp(34px, 3.3vw, 64px); line-height:1.15; letter-spacing:0; color:var(--muted); font-weight:800; }
    #focusBox { position:fixed; z-index:45; left:50%; bottom:28px; transform:translateX(-50%) translateY(130px); max-width:min(860px,calc(100vw - 48px)); padding:16px 18px; border-radius:8px; border:1px solid rgba(34,211,238,.55); background:rgba(16,21,34,.96); box-shadow:var(--shadow); color:var(--ink); transition:transform .24s ease; line-height:1.55; }
    #focusBox.show { transform:translateX(-50%) translateY(0); }
    @keyframes softReveal {
      from { opacity:.2; transform:translate3d(0,22px,0) scale(.992); }
      to { opacity:1; transform:translate3d(0,0,0) scale(1); }
    }
    @keyframes lightSweep {
      from { opacity:.2; transform:translateX(-2.2%); }
      to { opacity:1; transform:translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide, .slide.active .slide-inner, .slide.active::after { animation:none; transition:none; transform:none; filter:none; }
    }
    @media (max-width:1050px) {
      html, body { overflow:auto; }
      .slide { padding:70px 22px 70px; align-items:flex-start; overflow:auto; }
      .slide-inner, .slide.airy .slide-inner, .slide.dense .slide-inner { grid-template-columns:1fr; height:auto; gap:22px; }
      .slide.ending-slide .slide-inner { min-height:calc(100vh - 140px); }
      .content-side h1 { font-size:clamp(27px, 8vw, 38px); white-space:normal; }
      .point-list { grid-template-columns:1fr; }
      .point-card:nth-child(5) { grid-column:auto; }
      .image-side { min-height:0; height:auto; order:2; }
      .image-side img { height:auto; max-height:none; }
      .overview-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div id="progress"></div>
  <div id="pageInfo"></div>
  <div id="deckFooter">中信科技大學 企業管理系 柴康偉</div>
  <button id="overviewToggle" title="頁面總覽" aria-label="頁面總覽">☷</button>
  <aside id="overview" aria-label="頁面總覽">
    <div class="overview-head"><h2>頁面總覽</h2><button class="close-btn" id="closeOverview">關閉</button></div>
    <div class="overview-grid" id="overviewGrid"></div>
  </aside>
  <main id="deck"></main>
  <div id="focusBox" role="status" aria-live="polite"></div>

  <script>
    const deckData = [
      { title:"統計分析專題期末報告", layout:"dense", visual:"cover", points:[
        ["課程與題名","課程名稱為統計分析專題；報告題目依個人研究題目填寫。"],
        ["基本資料","班級、學號、姓名依個人資料填寫。"],
        ["報告日期","依實際報告日期填寫，作為正式期末報告封面資訊。"],
        ["簡報用途","作為問卷研究、統計分析與假設驗證結果的報告模板。"],
        ["填寫原則","每頁先保留分析欄位，待個人研究資料與統計輸出完成後補入。"]
      ]},
      { title:"研究題目", layout:"airy", visual:"topic", points:[
        ["明確題名","請清楚列出本次期末報告的研究題目。"],
        ["研究對象","題目中應能看出研究對象、情境或使用者族群。"],
        ["核心變數","題目宜包含主要自變數、依變數或關鍵構面。"],
        ["範例方向","例如服務品質、滿意度與再購意願之關係研究。"]
      ]},
      { title:"研究架構圖", layout:"dense", visual:"framework", points:[
        ["自變數","影響其他變數的主要因素。"],
        ["依變數","本研究欲解釋或預測的結果變數。"],
        ["中介變數","說明自變數如何影響依變數的中間機制；若未包含可不列入。"],
        ["調節變數","說明變數之間關係強弱是否會受到其他因素影響；若未包含可不列入。"],
        ["圖像呈現","架構圖需清楚標示變數名稱、箭頭方向與假設關係。"]
      ]},
      { title:"研究假設", layout:"dense", visual:"hypothesis", points:[
        ["H1","依研究架構圖列出第一項欲檢定的研究假設。"],
        ["H2","依變數關係列出第二項研究假設。"],
        ["H3","可放入中介、調節或其他主要效果假設。"],
        ["H4-H6","依研究模型需要延伸列出後續假設。"],
        ["撰寫原則","假設內容需對應後續使用的統計分析方法。"]
      ]},
      { title:"研究變數與問卷題項", layout:"dense", visual:"questionnaire", points:[
        ["變數名稱","列出本研究使用的各項構面或變數。"],
        ["題項編號","填入問卷題項代號，例如 SQ1、SAT1、BI1。"],
        ["題項內容","呈現受試者實際填答的問卷題目。"],
        ["參考文獻","標明題項來源或量表改編依據。"],
        ["整理方式","建議以變數名稱、題項編號、題項內容、參考文獻四欄呈現。"]
      ]},
      { title:"樣本基本資料分析", layout:"dense", visual:"sample", points:[
        ["性別","整理各性別類別的人數與百分比。"],
        ["年級","呈現不同年級或教育階段的樣本分布。"],
        ["年齡","依研究需要分組呈現年齡分布。"],
        ["使用經驗","整理受試者的產品、服務或系統使用經驗。"],
        ["呈現方式","每個變項需列出類別、人數與百分比。"]
      ]},
      { title:"敘述性統計分析", layout:"dense", visual:"descriptive", points:[
        ["構面","列出各研究構面或主要變數。"],
        ["題項數","標示每個構面包含的問卷題項數量。"],
        ["平均數","呈現受試者對各構面的整體填答程度。"],
        ["標準差","觀察填答分散程度與樣本意見一致性。"],
        ["排序","依平均數或研究需要排序，協助找出高低構面。"]
      ]},
      { title:"信效度分析", layout:"dense", visual:"validity", points:[
        ["信度分析","Cronbach's α 大於 .70 表示信度良好；.60 至 .70 尚可接受；低於 .60 需檢討題項。"],
        ["收斂效度","因素負荷量建議大於 .50，AVE 建議大於 .50，CR 建議大於 .70。"],
        ["區別效度","AVE 平方根應大於該構面與其他構面之相關係數。"],
        ["相關係數","各構面之間不宜過高，以避免區別效度不足。"],
        ["判斷結果","每個構面需填入檢定數值與是否通過的判斷。"]
      ]},
      { title:"相關分析", layout:"airy", visual:"correlation", points:[
        ["分析目的","檢驗各研究變數之間是否具有顯著相關。"],
        ["矩陣呈現","以變數 1 至變數 4 建立相關係數矩陣。"],
        ["顯著水準","p < .05 表示達顯著水準。"],
        ["高度顯著","p < .01 表示達高度顯著水準。"]
      ]},
      { title:"迴歸分析", layout:"dense", visual:"regression", points:[
        ["分析目的","依據研究假設，檢驗自變數對依變數是否具有顯著影響。"],
        ["主要欄位","依變數、自變數、β、t 值與 p 值。"],
        ["解釋力","呈現 R²、調整後 R² 與 F 值。"],
        ["判斷方式","依 p 值與 β 方向判斷假設是否獲得支持。"],
        ["報告連結","迴歸結果需回扣研究假設與研究架構圖。"]
      ]},
      { title:"中介效果分析", layout:"dense", visual:"mediation", points:[
        ["適用情況","若研究架構包含中介變數，需進行中介效果分析。"],
        ["路徑一","自變數 → 中介變數。"],
        ["路徑二","中介變數 → 依變數。"],
        ["間接效果","自變數 → 中介變數 → 依變數。"],
        ["判斷原則","p 值小於 .05，且 95% 信賴區間未包含 0，表示中介效果成立。"]
      ]},
      { title:"調節效果分析", layout:"dense", visual:"moderation", points:[
        ["適用情況","若研究架構包含調節變數，檢驗其是否影響自變數與依變數關係強弱。"],
        ["模型一","放入自變數。"],
        ["模型二","放入自變數與調節變數。"],
        ["模型三","放入自變數、調節變數與交互作用項。"],
        ["判斷原則","交互作用項 p 值小於 .05 表示調節效果成立；ΔR² 越大代表解釋力提升越明顯。"]
      ]},
      { title:"獨立樣本 t 檢定", layout:"dense", visual:"ttest", points:[
        ["適用情況","比較兩組受試者在某一研究變數上的差異。"],
        ["分析表欄位","變數、組別、人數、平均數、標準差、t 值、p 值與判斷結果。"],
        ["第一組","填入第一組的人數、平均數與標準差。"],
        ["第二組","填入第二組的人數、平均數與標準差。"],
        ["判斷原則","p 值小於 .05 表示兩組之間具有顯著差異；大於或等於 .05 則未達顯著。"]
      ]},
      { title:"單因子變異數分析", layout:"dense", visual:"anova", points:[
        ["適用情況","比較三組以上受試者在某一研究變數上的差異。"],
        ["ANOVA 表","呈現變數、組別、人數、平均數、標準差、F 值、p 值與判斷結果。"],
        ["事後比較","若 F 檢定達顯著，需進一步比較組別差異。"],
        ["比較組別","可呈現第一組－第二組、第一組－第三組、第二組－第三組。"],
        ["判斷原則","F 檢定 p 值小於 .05 表示至少有一組存在顯著差異；事後比較 p 值小於 .05 表示該兩組顯著。"]
      ]},
      { title:"研究假設驗證結果彙整", layout:"dense", visual:"summary", points:[
        ["H1-H6","依各項統計分析結果逐一整理假設是否成立。"],
        ["假設內容","保留原始假設敘述，方便與研究架構對照。"],
        ["分析方法","填入相關分析、迴歸分析、中介效果、調節效果、t 檢定或 ANOVA。"],
        ["檢定結果","簡要呈現 β、p 值、F 值或其他關鍵結果。"],
        ["是否成立","以成立、不成立或部分成立作為總結判斷。"]
      ]},
      { title:"結論", layout:"airy", visual:"conclusion", points:[
        ["主要研究發現","依分析結果整理本研究最重要的發現。"],
        ["假設驗證結果","總結哪些假設成立、哪些未成立。"],
        ["實務建議","提出可供實務應用或管理決策參考的建議。"],
        ["研究限制","說明樣本、問卷、分析方法或研究範圍的限制。"]
      ]},
      { title:"感謝聆聽", layout:"airy", visual:"ending", points:[
        ["期末報告總結","本簡報已完成研究題目、研究架構、統計分析與結論建議的完整報告流程。"],
        ["專業回應","歡迎針對研究設計、問卷題項、分析方法與研究結果提出指教。"],
        ["個人化呈現","中信科技大學 企業管理系 柴康偉。"],
        ["後續修訂","可依口頭報告回饋補強研究限制、實務建議與假設驗證說明。"]
      ]}
    ];

    const visualLabels = {
      cover:["期末報告","研究資料","統計分析","結論建議"],
      topic:["研究對象","核心變數","研究情境","題目聚焦"],
      framework:["自變數","中介變數","依變數","調節變數"],
      hypothesis:["H1","H2","H3","H4-H6"],
      questionnaire:["變數","題項","量表","文獻"],
      sample:["性別","年級","年齡","經驗"],
      descriptive:["平均數","標準差","題項數","排序"],
      validity:["信度","收斂效度","區別效度","判斷"],
      correlation:["變數 1","變數 2","變數 3","變數 4"],
      regression:["β","t 值","p 值","R²"],
      mediation:["X","M","Y","間接效果"],
      moderation:["X","Z","X×Z","Y"],
      ttest:["第一組","第二組","t 值","p 值"],
      anova:["第一組","第二組","第三組","F 檢定"],
      summary:["假設","方法","結果","成立"],
      conclusion:["發現","驗證","建議","限制"],
      ending:["感謝","提問","回饋","修訂"]
    };

    const palette = [
      ["#22d3ee","#f4b84a"],["#34d399","#38bdf8"],["#a78bfa","#22d3ee"],["#e75f7c","#f4b84a"],
      ["#38bdf8","#a78bfa"],["#34d399","#f4b84a"],["#22d3ee","#34d399"],["#f4b84a","#e75f7c"]
    ];

    function svgData(title, key, index) {
      const labels = visualLabels[key] || visualLabels.cover;
      const [c1, c2] = palette[index % palette.length];
      const diagram = key === "framework" || key === "mediation" || key === "moderation";
      const bars = key === "descriptive" || key === "regression" || key === "anova" || key === "ttest";
      const matrix = key === "correlation" || key === "validity" || key === "summary";
      const cards = labels.map((label, i) => {
        const x = i % 2 === 0 ? 150 : 720;
        const y = i < 2 ? 250 : 575;
        return `<rect x="${x}" y="${y}" width="330" height="112" rx="22" fill="#16233a" stroke="#fff" stroke-opacity=".16"/><text x="${x + 165}" y="${y + 67}" text-anchor="middle" font-size="28" font-weight="800" fill="#f8fafc">${label}</text>`;
      }).join("");
      const diagramShape = `<path d="M220 450H510" stroke="${c1}" stroke-width="16" stroke-linecap="round"/><path d="M485 410l70 40-70 40z" fill="${c1}"/><path d="M650 450H940" stroke="${c2}" stroke-width="16" stroke-linecap="round"/><path d="M915 410l70 40-70 40z" fill="${c2}"/><circle cx="210" cy="450" r="88" fill="${c1}" opacity=".92"/><circle cx="600" cy="450" r="88" fill="#0f172a" stroke="${c2}" stroke-width="8"/><circle cx="990" cy="450" r="88" fill="${c2}" opacity=".92"/><text x="210" y="462" text-anchor="middle" font-size="32" font-weight="900" fill="#07111f">${labels[0]}</text><text x="600" y="462" text-anchor="middle" font-size="32" font-weight="900" fill="#f8fafc">${labels[1]}</text><text x="990" y="462" text-anchor="middle" font-size="32" font-weight="900" fill="#07111f">${labels[2]}</text><rect x="410" y="205" width="380" height="94" rx="24" fill="#16233a" stroke="#fff" stroke-opacity=".16"/><text x="600" y="264" text-anchor="middle" font-size="30" font-weight="800" fill="#f8fafc">${labels[3]}</text>`;
      const barShape = labels.map((label, i) => `<rect x="${220 + i * 185}" y="${610 - i * 82}" width="105" height="${130 + i * 82}" rx="14" fill="${i % 2 ? c2 : c1}" opacity=".82"/><text x="${272 + i * 185}" y="690" text-anchor="middle" font-size="24" font-weight="800" fill="#f8fafc">${label}</text>`).join("");
      const matrixShape = `<g transform="translate(230 245)">${labels.map((label, i) => `<rect x="${(i % 2) * 360}" y="${Math.floor(i / 2) * 190}" width="300" height="128" rx="20" fill="${i % 2 ? c2 : c1}" opacity=".82"/><text x="${(i % 2) * 360 + 150}" y="${Math.floor(i / 2) * 190 + 78}" text-anchor="middle" font-size="28" font-weight="900" fill="#07111f">${label}</text>`).join("")}</g>`;
      const body = diagram ? diagramShape : bars ? barShape : matrix ? matrixShape : cards;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient><radialGradient id="glow" cx=".74" cy=".18" r=".78"><stop offset="0" stop-color="${c2}" stop-opacity=".46"/><stop offset=".58" stop-color="${c1}" stop-opacity=".12"/><stop offset="1" stop-color="#111827" stop-opacity="0"/></radialGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#020617" flood-opacity=".46"/></filter></defs><rect width="1200" height="900" rx="36" fill="#111827"/><rect width="1200" height="900" rx="36" fill="url(#glow)"/><path d="M0 705 C220 620 355 780 575 690 C820 590 940 480 1200 548 L1200 900 L0 900Z" fill="url(#g)" opacity=".20"/><g opacity=".10" stroke="#f8fafc" stroke-width="1"><path d="M90 130H1110M90 270H1110M90 410H1110M90 550H1110M90 690H1110"/><path d="M190 90V780M390 90V780M590 90V780M790 90V780M990 90V780"/></g><rect x="78" y="72" width="1044" height="756" rx="34" fill="#172033" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/><rect x="118" y="112" width="520" height="62" rx="18" fill="url(#g)" opacity=".95"/><text x="145" y="152" font-family="Microsoft JhengHei, Noto Sans TC, Arial" font-size="28" font-weight="900" fill="#07111f">${title}</text><g font-family="Microsoft JhengHei, Noto Sans TC, Arial">${body}</g></svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function backgroundData(title, key, index) {
      const labels = visualLabels[key] || visualLabels.cover;
      const [c1, c2] = palette[index % palette.length];
      const accent = palette[(index + 3) % palette.length][1];
      const leftY = 150 + (index % 4) * 24;
      const rightY = 180 + (index % 5) * 32;
      const ringX = 720 + (index % 3) * 70;
      const ringY = 260 + (index % 4) * 62;
      const labelText = labels.slice(0, 3).map((label, i) => `<text x="86" y="${640 + i * 48}" font-size="28" font-weight="800" fill="#f8fafc" opacity="${0.18 + i * 0.08}">${label}</text>`).join("");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="main" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}" stop-opacity=".56"/><stop offset="1" stop-color="${c2}" stop-opacity=".42"/></linearGradient><radialGradient id="pulse" cx=".72" cy=".28" r=".75"><stop offset="0" stop-color="${accent}" stop-opacity=".36"/><stop offset=".48" stop-color="${c1}" stop-opacity=".14"/><stop offset="1" stop-color="#101522" stop-opacity="0"/></radialGradient><pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/></pattern><filter id="blur"><feGaussianBlur stdDeviation="30"/></filter></defs><rect width="1920" height="1080" fill="#101522"/><rect width="1920" height="1080" fill="url(#pulse)"/><rect width="1920" height="1080" fill="url(#grid)"/><path d="M-80 ${leftY + 440} C290 ${leftY + 330} 440 ${leftY + 520} 790 ${leftY + 390} C1100 ${leftY + 275} 1380 ${leftY + 210} 2020 ${leftY + 335} L2020 1120 L-80 1120Z" fill="url(#main)" opacity=".18"/><circle cx="${ringX}" cy="${ringY}" r="240" fill="none" stroke="${c1}" stroke-width="42" stroke-opacity=".15"/><circle cx="${ringX + 260}" cy="${ringY + 110}" r="340" fill="none" stroke="${c2}" stroke-width="2" stroke-opacity=".24"/><circle cx="${ringX + 415}" cy="${ringY + 230}" r="92" fill="${accent}" opacity=".16" filter="url(#blur)"/><g transform="translate(1280 ${rightY})" opacity=".26"><rect x="0" y="0" width="420" height="92" rx="20" fill="${c1}"/><rect x="44" y="132" width="520" height="92" rx="20" fill="${c2}"/><rect x="-36" y="264" width="460" height="92" rx="20" fill="${accent}"/></g><g font-family="Microsoft JhengHei, Noto Sans TC, Arial">${labelText}<text x="86" y="144" font-size="42" font-weight="900" fill="#ffffff" opacity=".13">${String(index + 1).padStart(2,"0")}</text><text x="86" y="208" font-size="54" font-weight="900" fill="#ffffff" opacity=".11">${title}</text></g></svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    const deck = document.getElementById("deck");
    const overviewGrid = document.getElementById("overviewGrid");
    deckData.forEach((slide, index) => {
      const section = document.createElement("section");
      section.className = `slide ${slide.layout || "balanced"}${index === 0 ? " active" : ""}`;
      if (slide.visual === "ending") section.classList.add("ending-slide");
      section.dataset.slide = String(index + 1);
      section.style.setProperty("--slide-bg", `url("${backgroundData(slide.title, slide.visual, index)}")`);
      section.innerHTML = slide.visual === "ending"
        ? `<div class="slide-inner"><div class="ending-panel"><h1 class="ending-title">感謝聆聽</h1><p class="ending-subtitle">敬請指教</p></div></div>`
        : `<div class="slide-inner"><div class="content-side"><h1>${slide.title}</h1><div class="point-list">${slide.points.map((point, pointIndex) => `<article class="point-card" tabindex="0"><span class="point-index">${String(pointIndex + 1).padStart(2,"0")}</span><div class="point-text"><h2>${point[0]}</h2><p>${point[1]}</p></div></article>`).join("")}</div></div><figure class="image-side"><img src="${svgData(slide.title, slide.visual, index)}" alt="${slide.title}主題視覺"></figure></div>`;
      deck.appendChild(section);
      const card = document.createElement("button");
      card.className = "overview-card";
      card.dataset.target = String(index + 1);
      card.innerHTML = `<b>${String(index + 1).padStart(2,"0")}</b><span>${slide.title}</span>`;
      overviewGrid.appendChild(card);
    });

    const slides = Array.from(document.querySelectorAll(".slide"));
    const progressBar = document.getElementById("progress");
    const pageInfoEl = document.getElementById("pageInfo");
    const overview = document.getElementById("overview");
    const overviewToggle = document.getElementById("overviewToggle");
    const focusBox = document.getElementById("focusBox");
    const closeOverview = document.getElementById("closeOverview");
    let current = 1;
    let focusTimer = null;

    function showSlide(n) {
      current = Math.max(1, Math.min(slides.length, n));
      slides.forEach((slide, index) => slide.classList.toggle("active", index + 1 === current));
      progressBar.style.width = `${(current / slides.length) * 100}%`;
      pageInfoEl.textContent = `${String(current).padStart(2,"0")} / ${String(slides.length).padStart(2,"0")}`;
      document.title = `${deckData[current - 1].title}｜統計分析專題期末報告`;
    }

    function toggleOverview(force) {
      overview.classList.toggle("open", typeof force === "boolean" ? force : !overview.classList.contains("open"));
    }

    function showFocus(card) {
      document.querySelectorAll(".point-card.active").forEach(el => el.classList.remove("active"));
      card.classList.add("active");
      const title = card.querySelector("h2").textContent;
      const text = card.querySelector("p").textContent;
      focusBox.innerHTML = `<strong>${title}</strong><br>${text}`;
      focusBox.classList.add("show");
      clearTimeout(focusTimer);
      focusTimer = setTimeout(() => focusBox.classList.remove("show"), 3800);
    }

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") showSlide(current + 1);
      if (event.key === "ArrowLeft" || event.key === "PageUp") showSlide(current - 1);
      if (event.key.toLowerCase() === "o") toggleOverview();
      if (event.key.toLowerCase() === "f" && document.fullscreenEnabled) document.documentElement.requestFullscreen();
      if (event.key === "Escape") toggleOverview(false);
    });

    document.addEventListener("click", event => {
      const interactive = event.target.closest("button, .point-card, #overview");
      if (event.target.closest(".point-card")) showFocus(event.target.closest(".point-card"));
      if (interactive) return;
      if (event.clientX > window.innerWidth * .7) showSlide(current + 1);
      if (event.clientX < window.innerWidth * .3) showSlide(current - 1);
    });

    document.addEventListener("focusin", event => {
      if (event.target.closest(".point-card")) showFocus(event.target.closest(".point-card"));
    });

    overviewToggle.addEventListener("click", () => toggleOverview());
    closeOverview.addEventListener("click", () => toggleOverview(false));
    overviewGrid.addEventListener("click", event => {
      const card = event.target.closest(".overview-card");
      if (!card) return;
      showSlide(Number(card.dataset.target));
      toggleOverview(false);
    });

    showSlide(1);
  </script>
</body>
</html>
